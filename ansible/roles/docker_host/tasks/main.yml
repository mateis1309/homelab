---
- name: Install Docker engine and compose plugin
  ansible.builtin.apt:
    name: [docker.io, docker-compose-v2, python3-docker, sqlite3]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Ensure Docker is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Filter published ports
  when: docker_host_published_allow | length > 0
  block:
    - name: Install DOCKER-USER script
      ansible.builtin.template:
        src: docker-user-firewall.sh.j2
        dest: /usr/local/sbin/docker-user-firewall
        owner: root
        group: root
        mode: "0750"
      notify: Apply docker-user firewall

    - name: Install DOCKER-USER unit
      ansible.builtin.template:
        src: docker-user-firewall.service.j2
        dest: /etc/systemd/system/docker-user-firewall.service
        owner: root
        group: root
        mode: "0644"
      notify: Apply docker-user firewall

    - name: Enable DOCKER-USER unit
      ansible.builtin.systemd_service:
        name: docker-user-firewall
        enabled: true
        daemon_reload: true

- name: Create stack root
  ansible.builtin.file:
    path: /opt/stacks
    state: directory
    owner: root
    group: root
    mode: "0755"
