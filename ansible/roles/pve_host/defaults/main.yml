---
# Repositories: use the free no-subscription repo instead of the enterprise one.
pve_manage_repos: true

# /etc/network/interfaces: VLAN-aware bridge on the single NIC. Off by default because
# a mistake here takes the host offline; enable after checking pve_nic.
pve_manage_network: false
pve_nic: enp86s0
pve_bridge: vmbr0
pve_mgmt_vlan: 10

# Terraform API access (least privilege role, token without privilege separation)
pve_terraform_user: terraform@pve
pve_terraform_role: TerraformProv
pve_terraform_token: tf
pve_terraform_privileges:
  - Datastore.AllocateSpace
  - Datastore.AllocateTemplate
  - Datastore.Audit
  - Pool.Allocate
  - SDN.Use
  - Sys.Audit
  - Sys.Console
  - Sys.Modify
  - VM.Allocate
  - VM.Audit
  - VM.Clone
  - VM.Config.CDROM
  - VM.Config.Cloudinit
  - VM.Config.CPU
  - VM.Config.Disk
  - VM.Config.HWType
  - VM.Config.Memory
  - VM.Config.Network
  - VM.Config.Options
  - VM.GuestAgent.Audit
  - VM.Migrate
  - VM.PowerMgmt

# Cloud-init template that Terraform clones
pve_template_id: 9000
pve_template_name: ubuntu-2404-cloud
pve_template_storage: local-lvm
pve_template_image_url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
pve_template_image_path: /var/lib/vz/template/iso/noble-server-cloudimg-amd64.img
# Bake qemu-guest-agent into the image so Terraform can read the VM state on first boot.
pve_template_bake_agent: true
