---
- name: List roles
  ansible.builtin.command: pveum role list --output-format json
  register: pve_roles
  changed_when: false

- name: Create Terraform role
  ansible.builtin.command: >-
    pveum role add {{ pve_terraform_role }} -privs "{{ pve_terraform_privileges | join(',') }}"
  when: pve_terraform_role not in (pve_roles.stdout | from_json | map(attribute='roleid'))
  changed_when: true

- name: Keep Terraform role privileges in sync
  ansible.builtin.command: >-
    pveum role modify {{ pve_terraform_role }} -privs "{{ pve_terraform_privileges | join(',') }}"
  when: pve_terraform_role in (pve_roles.stdout | from_json | map(attribute='roleid'))
  changed_when: false

- name: List users
  ansible.builtin.command: pveum user list --output-format json
  register: pve_users
  changed_when: false

- name: Create Terraform user
  ansible.builtin.command: pveum user add {{ pve_terraform_user }} --comment "Terraform (managed by Ansible)"
  when: pve_terraform_user not in (pve_users.stdout | from_json | map(attribute='userid'))
  changed_when: true

- name: Grant role on /
  ansible.builtin.command: pveum acl modify / --users {{ pve_terraform_user }} --roles {{ pve_terraform_role }}
  changed_when: false

- name: List tokens
  ansible.builtin.command: pveum user token list {{ pve_terraform_user }} --output-format json
  register: pve_tokens
  changed_when: false

- name: Create API token
  ansible.builtin.command: >-
    pveum user token add {{ pve_terraform_user }} {{ pve_terraform_token }} --privsep 0 --output-format json
  register: pve_token_created
  when: pve_terraform_token not in (pve_tokens.stdout | from_json | map(attribute='tokenid'))
  changed_when: true
  no_log: true

- name: Show the token once (it cannot be read again)
  ansible.builtin.debug:
    msg: >-
      Put this in terraform/terraform.tfvars as pve_api_token:
      {{ pve_terraform_user }}!{{ pve_terraform_token }}={{ (pve_token_created.stdout | from_json).value }}
  when: pve_token_created is changed
