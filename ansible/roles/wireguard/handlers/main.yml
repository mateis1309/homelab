---
# syncconf updates peers in place without dropping existing tunnels.
- name: Reload wireguard
  ansible.builtin.shell: >-
    set -o pipefail &&
    wg syncconf {{ wireguard_interface }} <(wg-quick strip {{ wireguard_interface }})
    && wg set {{ wireguard_interface }} private-key /etc/wireguard/{{ wireguard_interface }}.key
  args:
    executable: /bin/bash
  changed_when: true
