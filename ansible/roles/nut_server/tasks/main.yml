---
- name: Install NUT
  ansible.builtin.apt:
    name: [nut-server, nut-client]
    state: present

- name: Set NUT mode
  ansible.builtin.copy:
    dest: /etc/nut/nut.conf
    content: "# {{ ansible_managed }}\nMODE=netserver\n"
    owner: root
    group: nut
    mode: "0640"
  notify: Restart nut

- name: Configure NUT
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/nut/{{ item }}"
    owner: root
    group: nut
    mode: "0640"
  loop: [ups.conf, upsd.conf, upsd.users, upsmon.conf]
  notify: Restart nut

- name: Ensure NUT is running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [nut-server, nut-monitor]
