---
# Hostnames must match keys in group_vars/all/lab.yml; addresses come from there.
# Devices configured through a vendor web UI (switches, NAS units) are not in the inventory;
# their settings are documented in docs/network.md and docs/backup.md.
all:
  children:
    routers:
      hosts:
        router:
    hypervisors:
      hosts:
        pve:
    vms:
      children:
        services:
          hosts:
            svc-01:
        monitoring:
          hosts:
            mon-01:
